version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: stokedfleet_user
      POSTGRES_PASSWORD: stokedfleet_pass
      POSTGRES_DB: stokedfleet
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stokedfleet_user -d stokedfleet"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://stokedfleet_user:stokedfleet_pass@db:5432/stokedfleet
      - CORS_ORIGIN=*
      - JWT_SECRET=my_super_secret_jwt_key_123!
    depends_on:
      db:
        condition: service_healthy
    # Run migrations before starting the application
    command: >
      sh -c "npx prisma migrate deploy && npx tsx src/index.ts"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
